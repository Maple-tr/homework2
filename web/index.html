<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>图书馆系统 - 首页</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/axios/1.6.7/axios.min.js"></script>
    <style>
        body { background-color: #f0f2f5; margin: 0; padding: 20px; font-family: 'Microsoft YaHei', sans-serif; }
        .header { background: #fff; padding: 20px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .header h2 { margin: 0; color: #333; }
        .btn-logout { padding: 8px 16px; background: #dc3545; color: white; border: none; border-radius: 6px; cursor: pointer; transition: 0.3s; }
        .btn-logout:hover { background: #c82333; }

        .cards { display: flex; flex-wrap: wrap; gap: 20px; }
        .card { background: #fff; width: 200px; padding: 30px 20px; border-radius: 10px; text-align: center; cursor: pointer; font-weight: bold; color: #333; box-shadow: 0 2px 8px rgba(0,0,0,0.05); transition: 0.3s; user-select: none; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 6px 16px rgba(0,0,0,0.1); color: #007bff; }

        .loading { text-align: center; color: #666; margin-top: 50px; font-size: 18px; }
    </style>
</head>
<body>
<div id="app">
    <!-- 加载中状态 -->
    <div class="loading" v-if="loading">正在加载用户信息...</div>

    <!-- 主要内容 -->
    <div v-else>
        <div class="header">
            <h2>欢迎您，{{ userInfo.name }} ({{ userInfo.role }})</h2>
            <button class="btn-logout" @click="logout">退出登录</button>
        </div>

        <div class="cards">
            <div class="card" v-for="menu in menus" :key="menu.name" @click="go(menu.path)">
                {{ menu.name }}
            </div>
        </div>
    </div>
</div>

<script>
    const { createApp, ref, onMounted } = Vue;

    // 1. 检查 Token
    const token = localStorage.getItem('token');
    if(!token) {
        window.location.href = 'login.html';
    }

    // 2. 全局配置 Axios (每次请求自动带上 Token)
    axios.defaults.headers.common['Authorization'] = token;

    // 3. 全局拦截 401 响应 (Token 失效自动退回登录页)
    axios.interceptors.response.use(res => res, err => {
        if(err.response && err.response.status === 401) {
            localStorage.removeItem('token');
            window.location.href = 'login.html';
        }
        return Promise.reject(err);
    });

    createApp({
        setup() {
            const userInfo = ref({ name: '', role: '' });
            const menus = ref([]);
            const loading = ref(true);

            const loadUserInfo = () => {
                axios.get('http://localhost:8080/api/users/info').then(res => {
                    if (res.data.code === 200) {
                        userInfo.value = res.data.data;

                        // 根据角色动态生成菜单卡片
                        const role = userInfo.value.role;
                        if (role === '管理员') {
                            menus.value = [
                                { name: '用户信息查询', path: 'user_query.html' },
                                { name: '图书管理', path: 'book_manage.html' },
                                { name: '借阅中心', path: 'borrow.html' },
                                { name: '操作日志', path: 'logs.html' }
                            ];
                        } else if (role === '操作员') {
                            menus.value = [
                                { name: '图书管理', path: 'book_manage.html' },
                                { name: '借阅中心', path: 'borrow.html' },
                                { name: '操作日志', path: 'logs.html' }
                            ];
                        } else if (role === '教师') {
                            menus.value = [
                                { name: '借阅中心', path: 'borrow.html' }
                            ];
                        } else if (role === '学生') {
                            menus.value = [
                                { name: '借阅中心', path: 'borrow.html' }
                            ];
                        }
                    }
                }).catch(err => {
                    console.error("获取信息失败", err);
                }).finally(() => {
                    loading.value = false;
                });
            };

            const logout = () => {
                localStorage.removeItem('token');
                window.location.href = 'login.html';
            };

            const go = (path) => {
                window.location.href = path;
            };

            onMounted(() => {
                loadUserInfo();

                // ==========================================
                // 开启消息轮询 (每 5 秒请求一次后端，看有没有预约到货通知)
                // ==========================================
                setInterval(() => {
                    axios.get('http://localhost:8080/api/loans/message').then(res => {
                        if (res.data.code === 200 && res.data.hasMessage) {
                            // 如果有消息，弹窗提示用户
                            alert(res.data.msg);
                        }
                    }).catch(err => {
                        // 忽略轮询时的网络报错，避免控制台刷屏
                    });
                }, 5000);
            });

            return { userInfo, menus, loading, logout, go };
        }
    }).mount('#app');
</script>
</body>
</html>
