<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>图书管理</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/axios/1.6.7/axios.min.js"></script>
    <style>
        body { background-color: #f0f2f5; margin: 0; padding: 20px; font-family: 'Microsoft YaHei', sans-serif; }
        .header { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .btn-back { padding: 8px 16px; background: #6c757d; color: white; text-decoration: none; border-radius: 6px; }
        .btn-add { padding: 8px 16px; background: #28a745; color: white; border: none; border-radius: 6px; cursor: pointer; }

        .search-box { background: #fff; padding: 15px; border-radius: 10px; display: flex; gap: 10px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .search-box input, .search-box select { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        .search-box button { padding: 8px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }

        table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; }
        .book-cover { width: 50px; height: 70px; object-fit: cover; border-radius: 4px; }

        .btn-edit { padding: 5px 10px; background: #ffc107; color: #333; border: none; border-radius: 4px; cursor: pointer; margin-right: 5px; }
        .pagination { display: flex; justify-content: center; gap: 10px; margin-top: 20px; }
        .pagination button { padding: 6px 12px; border: 1px solid #ccc; background: #fff; border-radius: 4px; cursor: pointer; }
        .pagination button:disabled { background: #e9ecef; cursor: not-allowed; }

        /* 弹窗样式 */
        .modal-mask { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .modal { background: #fff; padding: 30px; border-radius: 10px; width: 500px; max-height: 90vh; overflow-y: auto; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 14px; font-weight: bold; }
        .form-group input, .form-group textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .btn-save { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
<div id="app">
    <div class="header">
        <h2>图书管理</h2>
        <a href="index.html" class="btn-back">返回首页</a>
    </div>

    <!-- 搜索区 -->
    <div class="search-box">
        <input type="text" v-model="keyword" placeholder="请输入书名或作者...">
        <select v-model="type">
            <option value="">全部类型</option>
            <option value="计算机">计算机</option>
            <option value="文学">文学</option>
            <option value="经管">经管</option>
        </select>
        <button @click="search">查询</button>
        <button class="btn-add" style="margin-left: auto;" @click="openAdd">+ 新增图书</button>
    </div>

    <!-- 表格区 -->
    <table>
        <thead>
        <tr>
            <th>封面</th><th>书名</th><th>作者</th><th>类型</th><th>库存</th><th>状态</th><th>操作</th>
        </tr>
        </thead>
        <tbody>
        <tr v-for="book in books" :key="book.id">
            <td>
                <!-- 如果有图片就显示 -->
                <img v-if="book.coverUrl" :src="'http://localhost:8080' + book.coverUrl" class="book-cover">
                <span v-else>暂无封面</span>
            </td>
            <td>{{ book.title }}</td>
            <td>{{ book.author }}</td>
            <td>{{ book.type }}</td>
            <td>{{ book.stock }}</td>
            <td>{{ book.status }}</td>
            <td>
                <button class="btn-edit" @click="openEdit(book)">编辑</button>
            </td>
        </tr>
        </tbody>
    </table>

    <!-- 分页区 -->
    <div class="pagination">
        <button :disabled="page === 0" @click="changePage(-1)">上一页</button>
        <span>第 {{ page + 1 }} / {{ totalPages === 0 ? 1 : totalPages }} 页 (共 {{ total }} 条)</span>
        <button :disabled="page >= totalPages - 1" @click="changePage(1)">下一页</button>
    </div>

    <!-- 弹窗 (新增与编辑共用) -->
    <div class="modal-mask" v-if="showModal">
        <div class="modal">
            <h3>{{ form.id ? '编辑图书' : '新增图书' }}</h3>
            <div class="form-group"><label>书名</label><input type="text" v-model="form.title"></div>
            <div class="form-group"><label>作者</label><input type="text" v-model="form.author"></div>
            <div class="form-group"><label>类型</label><input type="text" v-model="form.type"></div>
            <div class="form-group"><label>出版社</label><input type="text" v-model="form.publisher"></div>
            <!-- 编辑时不允许修改库存，新增时可以填库存 -->
            <div class="form-group" v-if="!form.id">
                <label>库存数量 (将自动生成副本)</label>
                <input type="number" v-model="form.stock">
            </div>
            <div class="form-group"><label>价格</label><input type="number" v-model="form.price"></div>

            <!-- 图片上传区 -->
            <div class="form-group">
                <label>图书封面图片</label>
                <input type="file" @change="uploadImage" accept="image/*">
                <div v-if="form.coverUrl" style="margin-top: 10px;">
                    <img :src="'http://localhost:8080' + form.coverUrl" style="width: 100px; border-radius: 4px;">
                </div>
            </div>

            <button class="btn-save" @click="saveBook">保存</button>
            <button class="btn-save" style="background: #6c757d;" @click="showModal = false">取消</button>
        </div>
    </div>
</div>

<script>
    const { createApp, ref, onMounted } = Vue;
    const token = localStorage.getItem('token');
    if(!token) window.location.href = 'login.html';
    axios.defaults.headers.common['Authorization'] = token;

    createApp({
        setup() {
            const books = ref([]);
            const page = ref(0);
            const size = ref(10);
            const total = ref(0);
            const totalPages = ref(0);
            const keyword = ref('');
            const type = ref('');

            const showModal = ref(false);
            const form = ref({});

            onMounted(() => { loadData(); });

            const loadData = () => {
                axios.get('http://localhost:8080/api/books/page', {
                    params: { page: page.value, size: size.value, keyword: keyword.value, type: type.value }
                }).then(res => {
                    if(res.data.code === 200) {
                        // 注意：如果后端返回的 Book 对象里没有 coverUrl，我们需要处理
                        // 为了兼容处理，我们在后端增加一个 get 接口，或者前端直接用关联表查
                        // 为了演示，如果后端还没改，这里先自适应（见后面的后端修复）
                        books.value = res.data.data;
                        total.value = res.data.total;
                        totalPages.value = res.data.totalPages;
                    }
                });
            };

            const search = () => { page.value = 0; loadData(); };
            const changePage = (step) => { page.value += step; loadData(); };

            const openAdd = () => {
                form.value = { title: '', author: '', type: '', publisher: '', stock: 1, price: 0, coverUrl: '' };
                showModal.value = true;
            };

            const openEdit = (book) => {
                // 浅拷贝当前图书信息到表单
                form.value = { ...book };
                showModal.value = true;
            };

            const uploadImage = (event) => {
                const file = event.target.files[0];
                if(!file) return;
                const formData = new FormData();
                formData.append('file', file);
                axios.post('http://localhost:8080/api/files/upload', formData, {
                    headers: { 'Content-Type': 'multipart/form-data' }
                }).then(res => {
                    if(res.data.code === 200) {
                        form.value.coverUrl = res.data.url;
                        alert("图片上传成功！");
                    }
                });
            };

            const saveBook = () => {
                if(!form.value.title || !form.value.author) { alert("书名和作者必填"); return; }

                if(form.value.id) {
                    // 编辑
                    axios.put('http://localhost:8080/api/books/update', form.value).then(res => {
                        if(res.data.code === 200) { alert("修改成功"); showModal.value = false; loadData(); }
                        else { alert(res.data.msg); }
                    });
                } else {
                    // 新增
                    axios.post('http://localhost:8080/api/books', form.value).then(res => {
                        if(res.data.code === 200) { alert("新增成功"); showModal.value = false; loadData(); }
                        else { alert(res.data.msg); }
                    });
                }
            };

            return { books, page, total, totalPages, keyword, type, showModal, form, search, changePage, openAdd, openEdit, uploadImage, saveBook };
        }
    }).mount('#app');
</script>
</body>
</html>
